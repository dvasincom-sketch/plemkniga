services:
  postgres:
    image: postgres:16-alpine
    container_name: plemkniga-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plemkniga}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plemkniga}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем — база доступна только приложению.
    # Для отладки раскомментируйте:
    # ports: ['5432:5432']

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plemkniga-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-plemkniga}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Задайте PAYLOAD_SECRET в .env}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      PAYLOAD_DB_PUSH: ${PAYLOAD_DB_PUSH:-true}
    volumes:
      - media:/app/media
    ports:
      - '${APP_PORT:-3000}:3000'

volumes:
  pgdata:
  media:
